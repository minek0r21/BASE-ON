# 로컬 개발용 구성 (BASEON 폴더에서 실행). 서버 배포는 deploy/docker-compose.yml (docs/배포.md)
#   docker compose up -d                                    neo4j + api 켜기 → http://localhost:8000/docs
#   docker compose run --rm etl etl/01_load_core.py --season 2025   적재 (필요할 때만)
#   docker compose down                                     끄기 (DB는 볼륨에 남는다)
# 비밀번호·경로는 .env에서 읽는다 (.env.example 참고)
name: baseon

services:
  neo4j:
    image: neo4j:2026.09.0-community   # 패치까지 고정. 올릴 때는 03_check.py 회귀 기준을 다시 확인
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?.env에 NEO4J_PASSWORD(8자 이상)를 넣어야 한다}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:17474:7474"   # 브라우저 화면 http://localhost:17474 (7474는 Windows 예약 범위와 겹칠 수 있음)
      - "127.0.0.1:7687:7687"    # 컨테이너 밖에서 스크립트를 돌릴 때
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687         # 컨테이너끼리는 서비스 이름으로 접속
      WATCHFILES_FORCE_POLLING: "true"     # Windows 폴더를 연결하면 파일 변경 알림이 안 와서 주기적으로 확인
      REVIEW_LEDGER: /srv/review/decisions.jsonl   # 사람 판정 장부 (app/ledger.py, 검수는 PC에서만 — 서버에는 없다)
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/srv/backend             # 코드를 고치면 바로 반영 (개발용)
      - ./data/review:/srv/review          # 장부 (git 제외 — data/)
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    profiles: ["etl"]                      # up으로는 안 켜지고 run으로만 실행
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      KBO_PBP_DIR: /data/kbo_pbp
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./etl:/srv/etl
      - ./videos:/srv/videos
      - ./player_profile_view_cp949.csv:/srv/player_profile_view_cp949.csv:ro
      - ${KBO_PBP_HOST_DIR:-./data/kbo_pbp}:/data/kbo_pbp:ro   # 원본 기록 (scripts/get_data.py로 받은 곳)
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4jdata:
